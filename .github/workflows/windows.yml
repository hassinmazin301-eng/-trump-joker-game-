name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress clean package
          if ($LASTEXITCODE -ne 0) {
            throw "Maven build failed."
          }

      - name: Locate WiX installer tools
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue

          if (-not $candle) {
            $found = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $found) {
              choco install wixtoolset --yes --no-progress

              if ($LASTEXITCODE -ne 0) {
                throw "WiX installation failed."
              }

              $found = Get-ChildItem `
                -Path "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if (-not $found) {
              throw "Cannot find WiX candle.exe."
            }

            $found.DirectoryName |
              Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $arguments = @(
            "--type", "exe",
            "--name", "TrumpJoker",
            "--app-version", "1.0.0",
            "--vendor", "Hussein",
            "--description", "Local four-player Trump and Joker card game",
            "--input", "target/package",
            "--main-jar", "trump-joker-1.0.0.jar",
            "--main-class", "com.hussein.cardgame.Launcher",
            "--dest", "dist",
            "--win-per-user-install",
            "--win-dir-chooser",
            "--win-menu",
            "--win-shortcut",
            "--win-upgrade-uuid", "39484a98-e985-4f8c-a880-054b504240d7",
            "--java-options", "-Dfile.encoding=UTF-8"
          )

          & "$env:JAVA_HOME\bin\jpackage.exe" @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Installer creation failed."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TrumpJoker-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

